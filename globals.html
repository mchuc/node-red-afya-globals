<style>
  /* AFYA – common editor style (identical in all AFYA nodes) */
  .afya-form .form-row > label { width: 130px; }
  .afya-form .afya-section {
    display: flex; align-items: center; gap: 7px;
    margin: 18px 0 10px; padding-bottom: 5px;
    border-bottom: 1px solid var(--red-ui-secondary-border-color, #ddd);
    color: var(--red-ui-primary-text-color, #555);
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  .afya-form .afya-section > i { color: #3E9C86; width: 14px; text-align: center; }
  .afya-form .afya-hint { margin: -4px 0 12px 134px; font-size: 12px; line-height: 1.45; color: var(--red-ui-secondary-text-color, #888); }
  .afya-form .afya-hint code { font-size: 11px; }
  .afya-form .afya-check { display: flex; align-items: center; gap: 8px; margin: 0 0 12px 134px; }
  .afya-form .afya-check input { width: auto; margin: 0; }
  .afya-form .afya-check label { width: auto; margin: 0; cursor: pointer; }
  .afya-form .afya-unit { margin-left: 8px; color: var(--red-ui-secondary-text-color, #888); }
  .afya-form .afya-summary {
    display: flex; gap: 10px; align-items: flex-start;
    margin-top: 18px; padding: 10px 12px; border-radius: 6px;
    border-left: 4px solid #6CC1AD;
    background: var(--red-ui-tertiary-background, #f7f7f7);
    color: var(--red-ui-primary-text-color, #555); font-size: 12px; line-height: 1.55;
  }
  .afya-form .afya-summary > i { margin-top: 3px; color: #3E9C86; }
  .afya-form .afya-summary code { font-size: 11px; }
</style>

<script type="text/javascript">
  (function () {
    const randomName = (prefix) => prefix + Math.random().toString(36).slice(2, 7) + Date.now().toString().slice(-5);
    const plainKey = (v) => String(v || '').replace(/^#:\(\S+?\)::/, '');
    const isNumber = (v) => /^\s*[-+]?(\d+([.,]\d*)?|[.,]\d+)([eE][-+]?\d+)?\s*$/.test(String(v));
    const isJSON = (v) => { try { JSON.parse(v); return true; } catch (e) { return false; } };
    const TEXTS = {
      en: {
        name: 'Name', namePh: 'optional – shows the value when empty', lang: 'Labels', langAuto: 'system language ({l})',
        secVar: 'Variable', variable: 'Variable',
        varHint: 'Unique name. Choose <b>global</b> to read it from any flow: <code>global.get("name")</code>.',
        secInit: 'Initial value', value: 'Value', emit: 'Send the value to the output after deploy / restart',
        tStr: 'string', tInt: 'integer', tFloat: 'float', tBool: 'boolean', tNone: 'none – wait for msg.payload',
        sUntouched: 'On deploy {t} is left untouched.', sSet: 'On deploy {t} is set to the value above ({type}).',
        sOverwrite: 'Every incoming <code>msg.payload</code> overwrites it.',
        sConvert: 'Every incoming <code>msg.payload</code> overwrites it – plain values are converted to {type}.',
        sEmit: 'The value is also sent to the output right after deploy.',
      },
      pl: {
        name: 'Nazwa', namePh: 'opcjonalnie – puste = pokazuje wartość', lang: 'Etykiety', langAuto: 'język systemu ({l})',
        secVar: 'Zmienna', variable: 'Zmienna',
        varHint: 'Unikalna nazwa. Wybierz <b>global</b>, żeby czytać ją z każdego flow: <code>global.get("nazwa")</code>.',
        secInit: 'Wartość początkowa', value: 'Wartość', emit: 'Wyślij wartość na wyjście po wdrożeniu / restarcie',
        tStr: 'tekst', tInt: 'liczba całkowita', tFloat: 'liczba', tBool: 'prawda / fałsz', tNone: 'brak – czekaj na msg.payload',
        sUntouched: 'Po wdrożeniu {t} zostaje bez zmian.', sSet: 'Po wdrożeniu {t} dostaje wartość powyżej ({type}).',
        sOverwrite: 'Każdy przychodzący <code>msg.payload</code> ją nadpisuje.',
        sConvert: 'Każdy przychodzący <code>msg.payload</code> ją nadpisuje – zwykłe wartości są zamieniane na {type}.',
        sEmit: 'Wartość trafia też na wyjście zaraz po wdrożeniu.',
      },
    };
    // --- AFYA: język opisów w oknie konfiguracji („Labels”): auto = polski tylko dla polskiego systemu,
    //     angielski dla wszystkich innych; zmieniają się tylko opisy – nigdy pola ani wartości.
    const afyaSystemLocale = function () {
      try {
        return localStorage.getItem('editor-language') || navigator.language || '';
      } catch (e) {
        return navigator.language || '';
      }
    };
    const afyaLang = function (setting) {
      if (setting === 'pl' || setting === 'en') return setting;
      return /^pl\b|^pl[-_]/i.test(afyaSystemLocale()) ? 'pl' : 'en';
    };
    /** Tłumaczy otwarte okno (data-t, data-t-ph, data-t-title) i zwraca T(klucz, zmienne) dla tekstów z kodu. */
    const afyaApplyLang = function (form, texts, setting) {
      const lang = afyaLang(setting);
      const T = function (k, v) {
        let s = (texts[lang] && texts[lang][k]) || texts.en[k] || k;
        Object.keys(v || {}).forEach(function (n) {
          s = s.split('{' + n + '}').join(v[n]);
        });
        return s;
      };
      form.find('[data-t]').each(function () {
        $(this).html(T($(this).attr('data-t')));
      });
      form.find('[data-t-ph]').each(function () {
        $(this).attr('placeholder', T($(this).attr('data-t-ph')));
      });
      form.find('[data-t-title]').each(function () {
        $(this).attr('title', T($(this).attr('data-t-title')));
      });
      form.find('#node-input-lang option[value="auto"]').text(T('langAuto', { l: afyaLang('auto') === 'pl' ? 'Polski' : 'English' }));
      return T;
    };

    RED.nodes.registerType('AFYA-globals', {
      category: 'AFYA',
      color: '#A6DCCF',
      paletteLabel: 'set variable',
      icon: 'font-awesome/fa-globe',
      inputs: 1,
      outputs: 1,
      inputLabels: 'new value in msg.payload',
      outputLabels: 'msg.payload = stored value',
      defaults: {
        name: { value: '' },
        lang: { value: 'auto' },
        globalVariableName: { value: '', required: true },
        globalVariableScope: { value: 'global', required: true },
        globalVariableType: { value: 'undefined', required: true },
        globalVariableValue: { value: '' },
        globalEmitOnInit: { value: false },
      },
      label: function () {
        if (this.name) return this.name;
        const name = (this.globalVariableScope || 'global') + '.' + plainKey(this.globalVariableName);
        if (!this.globalVariableType || this.globalVariableType === 'undefined') return name;
        const value = this.globalVariableType === 'JSON' ? '{…}' : String(this.globalVariableValue);
        const label = name + ' = ' + value;
        return label.length > 42 ? label.slice(0, 41) + '…' : label;
      },
      labelStyle: function () {
        return this.name ? 'node_label_italic' : '';
      },
      oneditprepare: function () {
        const node = this;
        if (['auto', 'en', 'pl'].indexOf(node.lang) < 0) $('#node-input-lang').val('auto'); // starsze węzły
        const form = $('#node-input-lang').closest('.afya-form');
        let T = afyaApplyLang(form, TEXTS, $('#node-input-lang').val());

        // variable: global/flow + context store picker (native Node-RED widget)
        if (!plainKey(node.globalVariableName)) {
          $('#node-input-globalVariableName').val(randomName('GLOBAL_'));
        }
        $('#node-input-globalVariableName').typedInput({
          types: ['global', 'flow'],
          typeField: '#node-input-globalVariableScope',
        });

        // value: one field + type picker
        const jsonType = {
          value: 'JSON', label: 'JSON', icon: 'red/images/typedInput/json.svg', validate: isJSON,
        };
        if (RED.editor && typeof RED.editor.editJSON === 'function') {
          jsonType.expand = function () {
            const that = this;
            let value = this.value();
            try { value = JSON.stringify(JSON.parse(value), null, 4); } catch (e) { /* keep as is */ }
            RED.editor.editJSON({
              value: value,
              complete: function (v) {
                let compact = v;
                try { compact = JSON.stringify(JSON.parse(v)); } catch (e) { /* keep as is */ }
                that.value(compact);
              },
            });
          };
        }
        // legacy boolean values (1, 0, +, -) → true / false
        if (node.globalVariableType === 'bool') {
          const v = String(node.globalVariableValue).trim().toLowerCase();
          $('#node-input-globalVariableValue').val(['true', '1', '+'].includes(v) ? 'true' : 'false');
        }
        const valueTypes = function () {
          return [
            { value: 'str', label: T('tStr'), icon: 'red/images/typedInput/az.svg' },
            { value: 'int', label: T('tInt'), icon: 'red/images/typedInput/09.svg', validate: isNumber },
            { value: 'float', label: T('tFloat'), icon: 'red/images/typedInput/09.svg', validate: isNumber },
            { value: 'bool', label: T('tBool'), icon: 'red/images/typedInput/bool.svg', options: ['true', 'false'] },
            jsonType,
            { value: 'undefined', label: T('tNone'), hasValue: false },
          ];
        };
        $('#node-input-globalVariableValue').typedInput({
          typeField: '#node-input-globalVariableType',
          types: valueTypes(),
        });

        const summary = function () {
          const scope = $('#node-input-globalVariableName').typedInput('type');
          const key = plainKey($('#node-input-globalVariableName').typedInput('value')) || '…';
          const type = $('#node-input-globalVariableValue').typedInput('type');
          const target = '<code>' + scope + '.' + $('<span>').text(key).html() + '</code>';
          let text = type === 'undefined' ? T('sUntouched', { t: target }) : T('sSet', { t: target, type: type });
          text += ' ' + (type === 'undefined' ? T('sOverwrite') : T('sConvert', { type: type }));
          if ($('#node-input-globalEmitOnInit').is(':checked')) text += ' ' + T('sEmit');
          $('#afya-globals-summary').html(text);
        };
        $('#node-input-globalVariableName, #node-input-globalVariableValue').on('change', summary);
        $('#node-input-globalEmitOnInit').on('change', summary);
        $('#node-input-lang').on('change', function () {
          T = afyaApplyLang(form, TEXTS, $(this).val());
          const v = $('#node-input-globalVariableValue');
          const current = { type: v.typedInput('type'), value: v.typedInput('value') };
          v.typedInput('types', valueTypes());
          v.typedInput('type', current.type);
          v.typedInput('value', current.value);
          summary();
        });
        summary();
      },
    });
  })();
</script>

<script type="text/html" data-template-name="AFYA-globals">
  <div class="afya-form">
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> <span data-t="name">Name</span></label>
      <input type="text" id="node-input-name" data-t-ph="namePh" placeholder="optional – shows the value when empty" style="width: 65%;">
    </div>
    <div class="form-row">
      <label for="node-input-lang"><i class="fa fa-language"></i> <span data-t="lang">Labels</span></label>
      <select id="node-input-lang" style="width: 65%;">
        <option value="auto">system language</option>
        <option value="en">English</option>
        <option value="pl">Polski</option>
      </select>
    </div>

    <div class="afya-section"><i class="fa fa-database"></i> <span data-t="secVar">Variable</span></div>
    <div class="form-row">
      <label for="node-input-globalVariableName"><i class="fa fa-globe"></i> <span data-t="variable">Variable</span></label>
      <input type="text" id="node-input-globalVariableName" style="width: 65%;">
      <input type="hidden" id="node-input-globalVariableScope">
    </div>
    <div class="afya-hint" data-t="varHint">Unique name. Choose <b>global</b> to read it from any flow: <code>global.get("name")</code>.</div>

    <div class="afya-section"><i class="fa fa-pencil"></i> <span data-t="secInit">Initial value</span></div>
    <div class="form-row">
      <label for="node-input-globalVariableValue"><i class="fa fa-cube"></i> <span data-t="value">Value</span></label>
      <input type="text" id="node-input-globalVariableValue" style="width: 65%;">
      <input type="hidden" id="node-input-globalVariableType">
    </div>
    <div class="afya-check">
      <input type="checkbox" id="node-input-globalEmitOnInit">
      <label for="node-input-globalEmitOnInit" data-t="emit">Send the value to the output after deploy / restart</label>
    </div>

    <div class="afya-summary"><i class="fa fa-info-circle"></i><span id="afya-globals-summary"></span></div>
  </div>
</script>

<script type="text/html" data-help-name="AFYA-globals">
  <p>Sets a typed <b>global</b> or <b>flow</b> context variable – once on deploy and then with every incoming message.</p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>New value of the variable. Plain values (text, number, boolean) are converted to the chosen type,
      e.g. <code>"21,5"</code> → <code>21.5</code> for <i>float</i>. Objects and arrays are stored as they are.</dd>
  </dl>

  <h3>Outputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">any</span></dt>
    <dd>The stored (converted) value. The rest of the message is passed through.
      With <i>Send the value after deploy</i> the node also emits <code>msg.payload</code> (and <code>msg.topic</code> =
      variable name) 100&nbsp;ms after start.</dd>
  </dl>

  <h3>Types</h3>
  <ul>
    <li><b>string</b> – text.</li>
    <li><b>integer</b> – <code>Math.floor</code> of the number; comma or dot as decimal separator.</li>
    <li><b>float</b> – number; comma or dot as decimal separator.</li>
    <li><b>boolean</b> – accepts <code>true/false</code>, <code>1/0</code>, <code>+/-</code>.</li>
    <li><b>JSON</b> – object or array (edit it with the <i>…</i> button).</li>
    <li><b>none</b> – nothing is set on deploy, the node waits for <code>msg.payload</code>.</li>
  </ul>

  <h3>Details</h3>
  <p>The variable can be read anywhere: <code>global.get("name")</code> / <code>flow.get("name")</code>, or in
    <i>change</i>, <i>switch</i> and <i>inject</i> nodes. If more context stores are configured in
    <code>settings.js</code> (e.g. <i>file</i>), the store can be chosen next to the variable name.</p>
  <p>Status: <b>green</b> – value set, <b>grey</b> – waiting for the first value, <b>red</b> – conversion error
    (the message is passed to a <i>catch</i> node).</p>

  <h3>Polski</h3>
  <p>Ustawia zmienną kontekstu <b>global</b> lub <b>flow</b> z typem – raz po wdrożeniu i przy każdej wiadomości.
    Wartości proste z <code>msg.payload</code> są zamieniane na wybrany typ (przecinek lub kropka w liczbach),
    obiekty i tablice zapisywane bez zmian. Zmienną odczytasz w dowolnym flow przez
    <code>global.get("nazwa")</code>. Opcja „Send the value…” wysyła wartość na wyjście zaraz po starcie.</p>

  <p><small>Marcin Chuć · ORCID 0000-0002-8430-9763 · MIT</small></p>
</script>
